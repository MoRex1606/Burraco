<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#062a1c">
<title>بوراكو ديرية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen card table, portrait. Partner oben, Gegner links/rechts, Auslagen in der Mitte, eigene Hand unten. */
:root {
  --felt: #12573a;
  --felt-deep: #062a1c;
  --brass: #dcb462;
  --brass-dim: rgba(220, 180, 98, .35);
  --ink: #f2efe6;
  --ink-dim: rgba(242, 239, 230, .62);
  --panel: rgba(0, 0, 0, .26);
  --card: #fdfaf2;
  --card-red: #c21f2a;
  --card-black: #1b1b20;
  --back: #741427;
  --warn: #ffc08a;
  --f-display: "Marcellus", "Iowan Old Style", Georgia, serif;
  --f-body: "Tajawal", "Geeza Pro", system-ui, -apple-system, sans-serif;
  --f-arabic-display: "Reem Kufi", "Geeza Pro", serif;
  --cw: 52px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 45%, var(--felt) 0%, var(--felt-deep) 85%) fixed, var(--felt-deep);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%;
  display: flex; flex-direction: column; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
}
.panel { background: var(--panel); border: 1px solid var(--brass-dim); border-radius: 12px; }

/* Karten */
.card {
  width: var(--cw); height: calc(var(--cw) * 1.42); flex: none;
  background: var(--card); border-radius: calc(var(--cw) * .12);
  box-shadow: 0 1px 3px rgba(0,0,0,.45); position: relative;
  color: var(--card-black); box-sizing: border-box; border: 1px solid rgba(0,0,0,.15);
}
.card.red { color: var(--card-red); }
/* Kartenwerte in Tajawal: in Marcellus hängt das J unter die Grundlinie und sieht auf dem Handy wie ein I aus. */
.card .ix { position: absolute; left: 6%; top: 2%; line-height: 1; text-align: center; font-family: "Tajawal", system-ui, -apple-system, sans-serif; }
.card .ix b { display: block; font-size: calc(var(--cw) * .44); font-weight: 700; letter-spacing: -.04em; }
.card .ix i { font-style: normal; font-size: calc(var(--cw) * .34); }
.card .pip { position: absolute; right: 8%; bottom: 4%; font-size: calc(var(--cw) * .5); line-height: 1; opacity: .9; }
.card.joker { color: #8a5a12; }
.card.joker .pip { color: #b0852c; }
.card .jk { position: absolute; inset: 0; display: grid; place-items: center; font: 800 calc(var(--cw) * .24) var(--f-body); transform: rotate(-30deg); color: #8a5a12; }
.card .wild { position: absolute; right: 8%; top: 5%; font-size: calc(var(--cw) * .22); color: #b0852c; }
.card.sel { outline: 3px solid var(--brass); transform: translateY(-14px); }
.back {
  width: var(--cw); height: calc(var(--cw) * 1.42); flex: none; box-sizing: border-box;
  border-radius: calc(var(--cw) * .12); border: 1px solid var(--brass);
  background:
    repeating-linear-gradient(45deg, transparent 0 5px, rgba(220,180,98,.28) 5px 6px),
    repeating-linear-gradient(-45deg, transparent 0 5px, rgba(220,180,98,.28) 5px 6px),
    var(--back);
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.slot { width: var(--cw); height: calc(var(--cw) * 1.42); border: 1px dashed rgba(255,255,255,.3); border-radius: 6px; box-sizing: border-box; }

/* Kopf */
/* Punkte genau in der Mitte, links und rechts gleich breite Spalten; Kästen so hoch wie الهدف/الفتوح. */
body:has(#app.table) { margin-top: 0; }
#app.table { padding-top: max(2px, env(safe-area-inset-top, 0px)); }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; }
.top-side { display: flex; align-items: center; gap: 6px; min-width: 0; }
.top .comm-btn { width: 30px; height: 30px; }
.top .comm-btn svg { width: 17px; height: 17px; }
.top-side.end { justify-content: flex-end; }
/* Hochformat: Punkte stehen nur noch auf der Tafel; der obere Mitspieler rückt in die frei gewordene Mitte der Kopfzeile. */
.board > .seat:first-child { margin-top: calc(-1 * var(--top-h, 42px)); position: relative; z-index: 1; align-self: center; pointer-events: none; }
.icon-btn { background: none; border: 0; color: var(--brass); font-size: 20px; padding: 4px 8px; cursor: pointer; }
/* Großes Schließen-Kreuz: 44×44 Tippfläche (Apple-Empfehlung), Kreuz selbst deutlich größer. */
.top .icon-btn { width: 44px; height: 44px; margin: 0 -8px -14px 0; padding: 0; display: grid; place-items: center; font-size: 30px; line-height: 1; border-radius: 50%; }
.top .icon-btn:active { background: rgba(220,180,98,.15); }
/* Unsichtbare Tippfläche rund um das ✕, deutlich größer als das Zeichen selbst (ca. 64×64). */
.top .icon-btn { position: relative; z-index: 2; }
.top .icon-btn::before { content: ""; position: absolute; inset: -10px -10px -10px -14px; }
.scores { display: flex; justify-content: center; gap: 8px; }
.score { height: 30px; box-sizing: border-box; padding: 0 10px; text-align: center; min-width: 56px;
  display: flex; flex-direction: column; justify-content: center; line-height: 1; border-radius: 8px; }
.score small { display: block; font-size: 10px; color: var(--ink-dim); }
.score b { font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.score.us b { color: var(--brass); }
.goal { font-size: 11px; line-height: 15px; color: var(--ink-dim); white-space: nowrap; }

/* Sitzplätze */
.seat { display: flex; flex-direction: column; align-items: center; gap: 4px; --cw: 28px; }
.seat .fan { display: flex; position: relative; }
.seat .fan .back + .back { margin-left: calc(var(--cw) * -.62); }
.seat-label {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; direction: rtl;
  padding: 2px 8px; border-radius: 8px; background: rgba(8,20,14,.82); border: 1px solid var(--brass-dim);
  box-shadow: 0 1px 4px rgba(0,0,0,.5); line-height: 1.15;
}
.seat .name { font-size: 12px; font-weight: 700; }
.seat small { font-size: 10px; color: var(--ink-dim); }
.seat.active .seat-label { background: var(--brass); border-color: var(--brass); color: #1a1408; }
.seat.active small { color: #3a2c10; }

.mid { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.piles { display: flex; gap: 26px; align-items: center; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; --cw: 26px; }
/* Ziehstapel nur minimal größer als die beiden 100er-Stapel (22px). */
.pile:disabled { cursor: default; }
.pile.ready .back, .pile.ready .card { box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgba(220,180,98,.6); }
.pile small { font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.stack { position: relative; }
.stack .back:first-of-type { position: absolute; left: 1px; top: 1px; }
.pots { display: flex; gap: 4px; --cw: 22px; position: relative; }
/* Beschriftung direkt auf den Stapeln, gleicher Stil wie die Namen auf den Kartenrücken. */
.pile-label {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
  display: flex; flex-direction: column; align-items: center; white-space: nowrap; direction: rtl;
  padding: 2px 6px; border-radius: 7px; background: rgba(8,20,14,.82); border: 1px solid var(--brass-dim);
  box-shadow: 0 1px 4px rgba(0,0,0,.5); font-size: 11px; font-weight: 700; line-height: 1.15; color: var(--ink);
}
.pile-label small { font-size: 10px; font-weight: 400; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.pots .slot { border-radius: 3px; }

/* Ablage als Fächer */
.discard-row {
  display: flex; flex-direction: column; gap: 4px; align-items: stretch; cursor: pointer;
  background: var(--panel); border: 1px solid var(--brass-dim); border-radius: 12px; padding: 6px 10px 8px;
}
.discard-row:disabled { cursor: default; }
.discard-row.ready { border-color: var(--brass); box-shadow: 0 0 12px rgba(220,180,98,.45); }
/* Beschriftung auf Höhe der Karten hinter dem Fächer: spart eine Zeile, viele Karten dürfen sie verdecken. */
.discard-row { position: relative; }
.discard-label { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); z-index: 0; pointer-events: none;
  font-size: 12px; color: var(--ink-dim); text-align: start; font-variant-numeric: tabular-nums; white-space: nowrap; }
.discard-cards { position: relative; z-index: 1; }
.discard-row.ready .discard-label { color: var(--brass); }
.discard-cards { display: flex; --cw: 40px; min-height: calc(40px * 1.42); }
.discard-cards .card + .card { margin-left: var(--overlap, -10px); }

/* Kartenreihen bleiben links-nach-rechts, auch im arabischen Layout. */
.card, .mid, .piles, .pots, .fan, .fanned, .hand-inner, .discard-cards, .meld .cards { direction: ltr; }

/* Auslagen */
.melds { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.melds h3 { margin: 0; font: 700 13px var(--f-body); color: var(--brass); display: flex; gap: 8px; align-items: baseline; }
.melds h3 span { font-weight: 400; color: var(--ink-dim); font-size: 11px; }
.melds hr { border: 0; border-top: 1px solid var(--brass-dim); width: 100%; margin: 0; }
/* --meld-cw wird per JS (fitMelds) verkleinert, bis alle Auslagen ohne Scrollen in den Kasten passen. */
.meld-row { display: flex; flex-wrap: wrap; gap: calc(var(--meld-cw, 38px) * .22) calc(var(--meld-cw, 38px) * .32); }
.meld { display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 2px; cursor: pointer; border-radius: 6px; --cw: var(--meld-cw, 38px); }
.meld .cards { display: flex; }
.meld .cards .card + .card { margin-left: calc(var(--cw) * -.45); }
.meld .tag { font-size: 11px; font-weight: 800; color: var(--ink-dim); text-align: start; }
.meld .tag.clean { color: var(--brass); }
.meld .tag.pending { opacity: .55; text-decoration: line-through; }
.meld.target { box-shadow: 0 0 0 1px var(--brass-dim); }
.empty { font-size: 11px; color: rgba(242,239,230,.4); }

/* Status, Knöpfe, Hand */
.status { text-align: center; min-height: 34px; }
/* Immer genau eine Zeile, damit sich die Höhe des Spielbereichs darüber nie ändert. */
.status p { margin: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status p.err { color: var(--warn); font-weight: 600; }
.status small { font-size: 11px; color: var(--ink-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; justify-content: center; gap: 8px; }
.btn {
  font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 99px; cursor: pointer;
  border: 1px solid rgba(220,180,98,.6); background: rgba(0,0,0,.35); color: var(--brass);
}
.btn.primary { background: var(--brass); color: #1a1408; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .pile:focus-visible, .meld:focus-visible, .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* Hand passt immer in die Breite; Karten gedrückt halten und ziehen zum Umsortieren. */
.hand { padding: 22px 0 6px; --cw: 58px; touch-action: none; -webkit-touch-callout: none; }
.hand-inner { display: flex; justify-content: center; }
.hand .card { cursor: grab; transition: transform .15s; transform: translate(var(--dx, 0px), var(--dy, 0px)); }
.hand .card + .card { margin-left: var(--overlap, -22px); }
.hand .card.sel { outline: 3px solid var(--brass); --dy: -14px; }
.hand .card.dragging { transition: none; z-index: 3; cursor: grabbing; box-shadow: 0 10px 22px rgba(0,0,0,.55); }

/* Start und Wertung */
/* Start, Beitreten und Lobby: #app scrollt, wenn der Inhalt höher als der Bildschirm ist (z. B. Lobby auf dem iPhone). */
#app:not(.table) { overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.start { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.start .fanned { display: flex; --cw: 70px; }
.start .fanned .card:nth-child(1) { transform: rotate(-14deg) translateX(14px); }
.start .fanned .card:nth-child(2) { transform: translateY(-10px); z-index: 1; }
.start .fanned .card:nth-child(3) { transform: rotate(14deg) translateX(-14px); }
.start h1 { margin: 0; font: 700 46px var(--f-arabic-display); color: var(--brass); text-wrap: balance; }
.start .sub { margin: 4px 0 0; color: var(--ink-dim); }
.opts { padding: 14px; display: flex; flex-direction: column; gap: 12px; width: min(100%, 320px); box-sizing: border-box; }
.seg { display: flex; background: rgba(0,0,0,.3); border-radius: 99px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 99px; cursor: pointer; color: var(--ink-dim); font-weight: 600; }
.seg button.on { background: var(--brass); color: #1a1408; }
.goal-note { margin: 0; font-size: 14px; color: var(--ink-dim); text-align: center; }
.opts label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.opts input { accent-color: var(--brass); width: 20px; height: 20px; }
.rules-note { font-size: 12px; color: var(--ink-dim); max-width: 32ch; margin: 0; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 5; }
.summary { background: var(--felt-deep); border: 1px solid var(--brass); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; width: min(100%, 360px); box-sizing: border-box; }
.summary h2 { margin: 0; font: 700 26px var(--f-arabic-display); color: var(--brass); text-align: center; }
.summary table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.summary td, .summary th { padding: 4px 6px; text-align: end; }
.summary td:first-child, .summary th:first-child { text-align: start; color: var(--ink-dim); font-weight: 400; }
.summary tr.sum td { border-top: 1px solid var(--brass-dim); font-weight: 800; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hand .card { transition: none; } }
@media (max-height: 700px) { .hand { --cw: 52px; } .seat { --cw: 24px; } }
.summary { max-height: 100%; overflow-y: auto; }
/* Hilfscontainer nur fürs Querformat; hochkant verhalten sie sich, als gäbe es sie nicht. */
.board { display: contents; }
/* Hochformat: Auslagen des Gegners oben, كومة الحرق genau dazwischen, eigene Auslagen unten; jede Hälfte scrollt für sich. */
.melds { overflow: hidden; }
.mside { flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.melds h3.wm {
  position: absolute; inset: 0; z-index: 0; margin: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: 700 40px var(--f-arabic-display); color: rgba(220,180,98,.16);
}
.melds h3.wm span { font: 600 13px var(--f-body); color: rgba(220,180,98,.3); }
.mscroll { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.melds > .discard-row { flex: none; }
/* Statuszeile links neben den Tasten (Tasten rechts). */
.controls { display: flex; flex-direction: row-reverse; align-items: center; gap: 10px; }
.controls .status { flex: 1; min-width: 0; min-height: 0; }

/* Querformat (Handy quer): Tisch links/rechts aufteilen, Hand über die ganze Breite unten. */
@media (orientation: landscape) and (max-height: 560px) {
  .board > .seat:first-child { margin-top: 0; }
  #app { max-width: 1000px; overflow-y: auto; padding-block: 4px; gap: 6px; }
  #app.table {
    display: grid; gap: 4px 14px;
    grid-template-columns: minmax(0, 270px) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "top melds" "board melds" "controls melds" "hand hand";
  }
  .top { grid-area: top; }
  .score { padding: 0 6px; min-width: 46px; }
  .top, .top-side { gap: 4px; }
  .goal { font-size: 10px; }
  .seat .fan .back + .back { margin-left: calc(var(--cw) * -.72); }
  /* Schmale rechte Spalte in Zeilen: ✕ + Ziel/Tafel · rechts/Partner/links · Stapel · Hinweis · Tasten. */
  .top { display: flex; }
  .top .top-mid { display: none; }
  .top-side.end { justify-content: flex-start; }
  .board { grid-area: board; display: grid; grid-template-columns: auto auto 1fr; grid-template-areas: "p p p" "r l ." "piles piles ."; align-items: center; gap: 6px 18px; /* Partner am rechten Rand unter der Kopfzeile, darunter اليمين und direkt daneben اليسار */ }
  .board .mid { display: contents; }
  .board > .seat:first-child { grid-area: p; justify-self: start; } /* RTL: start = rechter Rand */
  .board .mid > :first-child { grid-area: l; justify-self: start; } /* direkt links neben اليمين */
  .board .mid > :last-child { grid-area: r; justify-self: start; } /* RTL: start = rechts */
  .board .piles { grid-area: piles; justify-self: center; }
  .seat { --cw: 24px; }
  .piles { gap: 16px; }
  .discard-row { padding: 2px 8px 4px; gap: 2px; }
  .discard-cards { --cw: 32px; min-height: calc(32px * 1.42); }
  .melds { grid-area: melds; }
  /* Hinweistext rechts oben, Tasten eine Zeile darunter (ebenfalls rechts). */
  .controls { grid-area: controls; display: flex; flex-direction: column; align-items: stretch; align-self: start; gap: 6px; }
  .controls .status { flex: none; }
  .actions { justify-content: flex-start; }
  .status { flex: 1; min-width: 0; min-height: 0; text-align: start; }
  .btn { padding: 7px 14px; }
  .hand { grid-area: hand; padding: 12px 0 0; --cw: 46px; }
  .start { gap: 12px; padding-block: 8px; }
  .start .fanned { --cw: 46px; }
  .start h1 { font-size: 34px; }
}

/* Tablet quer: Auslagen links und rechts in voller Höhe, Tisch in der Mitte, Hand unten. */
@media (orientation: landscape) and (min-height: 561px) and (min-width: 900px) {
  .board > .seat:first-child { margin-top: 0; }
  #app { max-width: 1500px; }
  #app.table {
    display: grid; gap: 8px 16px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "them top us" "them board us" "them discard us" "them controls us" "hand hand hand";
  }
  .top { grid-area: top; }
  .board { grid-area: board; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .board .mid { align-self: stretch; }
  .discard-row { grid-area: discard; }
  .melds { display: contents; }
  .melds hr { display: none; }
  .mside { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--brass-dim); border-radius: 12px; }
  .mside.them { grid-area: them; }
  .mside.us { grid-area: us; }
  .meld { --cw: var(--meld-cw, 44px); }
  .melds h3.wm { font-size: 56px; }
  .controls { grid-area: controls; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .controls .status { flex: none; }
  .hand { grid-area: hand; padding: 18px 0 4px; --cw: 60px; }
}

/* Online: Name, Code, Warteraum */
.opts label.field, .field { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; font-size: 13px; color: var(--ink-dim); text-align: start; }
.opts .field input, .field input { width: auto; height: auto; box-sizing: border-box; font: inherit; font-size: 16px; color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--brass-dim); border-radius: 10px; padding: 9px 12px; -webkit-user-select: text; user-select: text; }
.field input.code { font: 700 24px var(--f-display); letter-spacing: .25em; text-align: center; text-transform: uppercase; direction: ltr; }
.btn-col { display: flex; flex-direction: column; gap: 10px; width: min(100%, 320px); }
.btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.room-code { font: 700 40px var(--f-display); letter-spacing: .2em; color: var(--brass); direction: ltr; margin: 0; }
.seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

"use strict";

  st.tookPot = [false, false];
  st.opened = [false, false];

  st.current = (st.dealer + 1) % st.players.length;
  st.phase = "draw";
  st.turn = 0;
  st.firstDrawId = null;
  st.mustMeld = false;
  st.takenIds = null;

  st.lastRound = null;

const curTeam = st => teamOf(st.current);
const hasProject = (st, t) => st.melds[t].some(m => isProject(m, st.rules));
// Bedingung zum Beenden: immer zwei Projekte. Variante "2×200": beide ohne Joker (200+).
// Variante "200+100": mindestens eins ohne Joker (200+), das andere darf genau einen Joker haben (100/150).

}
const canClose = (st, t) => meldsAllowClose(st.melds[t], st.rules);
const closeText = c => c === 2 ? "مشروعين 200" : "مشروع 200 ومشروع 100";
const closeShort = c => c === 2 ? "2×200" : "200+100";
const speedOf = v => v === 2 ? 2 : 1; // 1 = عادي (30 s), 2 = سريع (20 s)
const speedSecs = v => speedOf(v) === 2 ? 20 : 30;
const speedText = v => speedOf(v) === 2 ? "سريع (20 ثانية)" : "عادي (30 ثانية)";
const closeRules = () => Object.assign({}, BASE_RULES, { closeClean: ui.close === 2 ? 2 : 1, turnSecs: speedSecs(ui.speed) });
const canTakePot = (st, t) => !st.tookPot[t] && st.pots.length > 0;
const needsOpening = (st, t) => st.scores[t] >= st.rules.openingThreshold && !st.opened[t];

function drawStock(st) {
  if (st.phase !== "draw") fail("لقد سحبت ورقة بالفعل.");
  if (!st.stock.length) fail("كومة السحب فارغة.");
  const c = st.stock.pop();
  st.hands[st.current].push(c);

  if (st.hands[st.current].length === 1 && st.discard.length === 1) fail("لا يمكنك أخذ كومة حرق فيها ورقة واحدة وبيدك ورقة واحدة.");

  const n = st.discard.length;

  st.hands[st.current].push(...st.discard);
  st.discard = [];

  st.mustMeld = true;
  st.log = st.players[st.current].name + ": أخذ كومة الحرق (" + n + " أوراق).";

function cardsFromHand(st, ids) {
  if (!ids.length) fail("لم تختر أي ورقة.");

const clone = st => JSON.parse(JSON.stringify(st));

function consecutive(sorted) {

  for (const p of sorted) {
    const last = segs.length ? segs[segs.length - 1] : null;
    if (last && p === last[last.length - 1] + 1) last.push(p); else segs.push([p]);

function meldCandidates(hand, r) {
  const nat = hand.filter(c => !isWild(c)), wild = hand.find(isWild), out = [];
  const byRank = {};
  nat.forEach(c => (byRank[c.rank] = byRank[c.rank] || []).push(c));
  for (const g of Object.values(byRank)) {
    if (g.length >= r.minMeld) out.push(g);

  for (let s = 0; s < 4; s++) {
    const byPos = new Map();
    nat.filter(c => c.suit === s).forEach(c => (c.rank === 1 ? [1, 14] : [c.rank]).forEach(p => { if (!byPos.has(p)) byPos.set(p, c); }));
    const segs = consecutive([...byPos.keys()].sort((a, b) => a - b));
    const toCards = seg => seg.map(p => byPos.get(p));
    segs.filter(g => g.length >= r.minMeld).forEach(g => out.push(toCards(g)));
    if (wild) {
      segs.filter(g => g.length === r.minMeld - 1).forEach(g => out.push(toCards(g).concat([wild])));

function handOverlap(n) {

  if (n <= 1) return 0;
  const width = Math.min(app.clientWidth || window.innerWidth, TABLET.matches ? 1500 : LANDSCAPE.matches ? 1000 : 560) - 36;
  const step = Math.min(cw - 22, (width - cw) / (n - 1));

}

function discardOverlap(n) {

let drag = null;
const LONG_PRESS_MS = 220, MOVE_THRESHOLD = 8;

app.addEventListener("pointerdown", e => {

  if (!el || !ui.st) return;
  const cards = [...app.querySelectorAll(".hand .card")];
  const index = cards.indexOf(el);
  const step = cards.length > 1 ? cards[1].getBoundingClientRect().left - cards[0].getBoundingClientRect().left : 0;
  drag = { el, cards, index, target: index, step, startX: e.clientX, startY: e.clientY, active: false, pointerId: e.pointerId, timer: null };
  drag.timer = setTimeout(() => startDrag(), LONG_PRESS_MS);

function startDrag() {
  if (!drag || drag.active) return;

}
app.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;

  if (!drag.active) return;
  e.preventDefault();
  drag.el.style.setProperty("--dx", dx + "px");
  const target = drag.step > 0 ? Math.max(0, Math.min(drag.cards.length - 1, Math.round(drag.index + dx / drag.step))) : drag.index;
  if (target === drag.target) return;
  drag.target = target;
  drag.cards.forEach((c, i) => {
    if (c === drag.el) return;
    let shift = 0;
    if (drag.index < target && i > drag.index && i <= target) shift = -drag.step;
    if (target < drag.index && i >= target && i < drag.index) shift = drag.step;
    c.style.setProperty("--dx", shift + "px");
  });
});
function endDrag(e, cancelled) {

    if (!cancelled && d.target !== d.index && ui.st) {

        : `<button class="btn" data-act="discard" ${canPlay && ui.selected.size === 1 ? "" : "disabled"}>ارمِ</button>`}
      ${canBot ? '<button class="btn" data-act="botseat">دع الكمبيوتر يلعب عنه</button>' : ""}
    </div></div>
    <div class="hand" style="--overlap:${handOverlap(hand.length)}px">${sayHTML(ui.me)}<div class="hand-inner">
      ${hand.map(c => cardHTML(c, ui.selected.has(c.id) ? "sel" : "")).join("")}</div></div>`;

  if (st.phase === "roundOver" || st.phase === "gameOver") html += summaryHTML(st);

}
// Alle Auslagen beider Seiten sollen im Kasten sichtbar sein: Karten so weit verkleinern, bis nichts mehr überläuft.
const MELD_CW_MIN = 16;
function fitMelds() {
  const boxes = [".mside.them .mscroll", ".mside.us .mscroll"];
  const base = TABLET.matches ? 44 : 38;
  for (const q of boxes) {
    const el = app.querySelector(q);
    if (!el) continue;
    el.style.removeProperty("--meld-cw");
    const fits = () => el.scrollHeight <= el.clientHeight + 1;
    if (!el.clientHeight || fits()) continue;
    let lo = MELD_CW_MIN, hi = base - 1;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      el.style.setProperty("--meld-cw", mid + "px");
      if (fits()) lo = mid; else hi = mid - 1;
    }
    el.style.setProperty("--meld-cw", lo + "px");
  }
}
function summaryHTML(st) {

function applyAction(st, a) {
  if (a.a === "draw") return drawStock(st);
  if (a.a === "take") return takeDiscard(st);
  if (a.a === "return") return returnDiscard(st);
  if (a.a === "lay") { const r = layMeld(st, a.ids); addTurnTime(st); return r; }
  if (a.a === "add") { const r = addToMeld(st, a.meld, a.ids); addTurnTime(st); return r; }
  if (a.a === "discard") return discardCard(st, a.id);
  fail("حركة غير معروفة.");
}
function humanAction(a) {
  if (!isHumanTurn()) return;
  if (net && !net.host) { ui.msg = null; return netSend({ t: "act", a }); }
  try {
    applyAction(ui.st, a);
    ui.msg = null;
    const ids = new Set(ui.st.hands[ui.me].map(c => c.id));
    ui.selected = new Set([...ui.selected].filter(id => ids.has(id)));
  } catch (e) {
    if (!(e instanceof GameError)) throw e;
    ui.msg = e.message;
  }
  render();
  runComputer();
}
const selectedInHandOrder = () => ui.st.hands[ui.me].map(c => c.id).filter(id => ui.selected.has(id));

async function runComputer() {
  const st = ui.st;
  if (net && !net.host) return;
  if (!st || ui.thinking || (st.players[st.current].human && !st.players[st.current].bot) || !(st.phase === "draw" || st.phase === "play")) return;
  ui.thinking = true;
  const gen = ui.gen;
  const alive = () => gen === ui.gen;
  const step = async () => { render(); await sleep(650); return alive(); };
  try {
    while ((st.phase === "draw" || st.phase === "play") && (!st.players[st.current].human || st.players[st.current].bot)) {
      if (!(await step())) return;
      if (aiWantsDiscard(st) && aiCanUseDiscard(st)) { try { takeDiscard(st); } catch (e) {} }
      if (st.phase === "draw") drawStock(st);
      let mv;
      if (st.mustMeld && !aiNextMove(st)) {
        if (!(await step())) return;
        if ((mv = findAnyMove(st))) mv.t === "meld" ? layMeld(st, mv.ids) : addToMeld(st, mv.meld, mv.ids);
        else returnDiscard(st);
      }
      while ((mv = aiNextMove(st))) {
        if (!(await step())) return;
        mv.t === "meld" ? layMeld(st, mv.ids) : addToMeld(st, mv.meld, mv.ids);
      }
      if (!(await step())) return;
      const id = aiChooseDiscard(st);
      try { discardCard(st, id); }
      catch (e) {
        for (const c of st.hands[st.current]) { try { discardCard(st, c.id); break; } catch (e2) {} }
      }
    }
  } finally {
    if (alive()) { ui.thinking = false; render(); }
  }
}

function startGame() {
  netLeave();
  ui.me = 0;
  const players = ui.mode === "teams"
    ? [{ name: "أنت", human: true }, { name: "اليمين" }, { name: "الشريك" }, { name: "اليسار" }]
    : [{ name: "أنت", human: true }, { name: "الكمبيوتر" }];
  const rules = closeRules();
  ui.gen++; ui.thinking = false;
  ui.st = newGame(players, rules);
  ui.screen = "table"; ui.selected = new Set(); ui.msg = null;
  render();
  runComputer();
}

app.addEventListener("click", e => {
  if (e.target.closest(".hand .card")) return; // läuft über die Pointer-Events oben
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === "mode") { ui.mode = el.dataset.v; return render(); }
  if (act === "close") { ui.close = Number(el.dataset.v); return render(); }
  if (act === "speed") { ui.speed = speedOf(Number(el.dataset.v)); return render(); }
  if (act === "start") return startGame();
  if (act === "sheet") { ui.sheet = true; return render(); }
  if (act === "sheetclose") { if (e.target === el || el.tagName === "BUTTON") { ui.sheet = false; render(); } return; }
  if (act === "askquit") return askQuit();
  if (act === "cancelquit") { ui.confirmQuit = null; return render(); }
  if (act === "quit" && ui.confirmQuit && Date.now() < ui.confirmQuit.until) return;
  if (act === "quit") ui.confirmQuit = null;
  if (act === "quit") {
    quitCleanup();
    netLeave(); ui.gen++; ui.thinking = false; ui.screen = "start"; ui.st = null; ui.me = 0; return render(); }
  if (act === "next") {
    if (net && !net.host) return;
    startRound(ui.st); ui.selected = new Set(); ui.msg = null; render(); return runComputer();
  }
  if (act === "draw") return humanAction({ a: "draw" });
  if (act === "take") return humanAction({ a: "take" });
  if (act === "return") { ui.selected = new Set(); return humanAction({ a: "return" }); }
  if (act === "lay") return humanAction({ a: "lay", ids: selectedInHandOrder() });
  if (act === "discard") return humanAction({ a: "discard", id: [...ui.selected][0] });
  if (act === "add") {
    if (!ui.selected.size) return;
    return humanAction({ a: "add", meld: el.dataset.meld, ids: selectedInHandOrder() });
  }
  if (commClick(act, el, e)) return;
  if (onlineClick(act, el) !== false) return;
});

// ---------- Online mit Freunden ----------
// Peer-to-Peer über PeerJS: Das Gerät des Gastgebers hält den echten Spielstand und prüft alle Züge.
// Die anderen schicken nur ihre Züge und bekommen den Tisch zurück, ohne fremde Handkarten.
const ONLINE = typeof Peer !== "undefined";
const NET_PREFIX = "brk-deir-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const urlParams = new URLSearchParams(location.search);
let net = null;
if (urlParams.get("room")) { ui.code = urlParams.get("room").toUpperCase(); ui.screen = "join"; }

function clientId() {
  let id = localStorage.getItem("brk-cid");
  if (!id) { id = Math.random().toString(36).slice(2, 12); localStorage.setItem("brk-cid", id); }
  return id;
}
function peerOptions() {
  // Zum Testen mit eigenem PeerServer: ?peerhost=localhost:9000
  const h = urlParams.get("peerhost");
  if (!h) return { debug: 0 };
  const [host, port] = h.split(":");
  return { host, port: Number(port) || 443, path: "/", secure: !port || port === "443", debug: 1 };
}
const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const inviteLink = code => location.origin + location.pathname + "?room=" + code;
const seatCount = () => ui.mode === "teams" ? 4 : 2;
const SEAT_NAMES = { 4: ["المقعد ١", "المقعد ٢", "المقعد ٣", "المقعد ٤"], 2: ["المقعد ١", "المقعد ٢"] };
function savedHost() {
  try { return JSON.parse(localStorage.getItem("brk-host")); } catch (e) { return null; }
}
function netBadge() {
  if (!net) return "";
  if (net.host) return net.status === "open" ? "متصل" : "جارِ الاتصال …";
  return net.status === "open" ? "متصل" : "انقطع الاتصال، جارِ إعادة المحاولة …";
}

// Was ein Mitspieler sehen darf: eigene Hand ja, fremde Hände und Stapel nur als Anzahl.
function redact(st, seat) {
  const c = clone(st);
  c.hands = st.hands.map((h, p) => p === seat ? h : h.map(() => 0));
  c.stock = st.stock.map(() => 0);
  c.pots = st.pots.map(p => p.map(() => 0));
  c.players = st.players.map(p => ({ name: p.name, human: !!p.human, offline: !!p.offline, bot: !!p.bot }));
  return c;
}

// ----- Gastgeber -----
function hostRoom(saved) {
  netLeave();
  ui.st = null; ui.me = 0;
  net = {
    host: true, status: "connecting", code: saved ? saved.code : newCode(), conns: new Map(), sent: new Map(),
    seats: saved ? saved.seats : [{ name: ui.name || "المضيف", cid: "host" }, null, null, null].slice(0, seatCount()),
    pick: null, tries: 0,
  };
  if (saved) {
    ui.mode = saved.mode; ui.close = saved.close === 2 ? 2 : 1; ui.speed = speedOf(saved.speed); ui.st = migrateState(saved.st); ui.me = saved.me || 0;
    if (ui.st) ui.st.players.forEach(p => { if (p.cid && p.cid !== "host") p.offline = true; });
    net.seats.forEach(s => { if (s && s.cid !== "host") s.online = false; });
  }
  ui.screen = ui.st ? "table" : "lobby";
  ui.selected = new Set(); ui.msg = null;
  hostOpen();
  render();
  if (ui.st) runComputer();
}
function hostOpen() {
  const me = net, peer = new Peer(NET_PREFIX + me.code, peerOptions());
  me.peer = peer;
  peer.on("open", () => { if (net !== me) return; me.status = "open"; me.tries = 0; render(); });
  peer.on("call", call => { if (net === me) voiceIncoming(call); else call.close(); });
  peer.on("connection", conn => {
    conn.on("data", d => { if (net === me) hostOnData(conn, d); });
    conn.on("close", () => { if (net === me) hostOnClose(conn); });
    conn.on("error", () => { if (net === me) hostOnClose(conn); });
  });
  peer.on("disconnected", () => setTimeout(() => { if (net === me && !peer.destroyed) peer.reconnect(); }, 1500));
  peer.on("error", e => {
    if (net !== me) return;
    if (e.type === "unavailable-id" && me.tries++ < 20) {
      // Nach einem Neuladen ist der Code beim Server noch kurz belegt.
      peer.destroy(); setTimeout(() => { if (net === me) hostOpen(); }, 3000);
    } else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed") {
      me.status = "connecting"; render();
    } else if (e.type !== "peer-unavailable") { me.error = e.type; render(); }
  });
  if (!me.ping) me.ping = setInterval(() => {
    if (net !== me) return clearInterval(me.ping);
    const now = Date.now();
    for (const conn of me.conns.values()) {
      if (now - (conn.heard || now) > 15000) { conn.close(); hostOnClose(conn); continue; }
      if (conn.open) conn.send({ t: "ping", now: Date.now() });
    }
    voiceSync();
  }, 5000);
}
const hostPlayer = cid => ui.st ? ui.st.players.findIndex(p => p.cid === cid) : -1;
function hostOnData(conn, d) {
  conn.heard = Date.now();
  if (!d || typeof d !== "object") return;
  if (d.t === "hello") {
    const cid = String(d.cid || "").slice(0, 20), name = String(d.name || "").trim().slice(0, 16) || "صديق";
    if (!cid || cid === "host") return;
    if (ui.st) {
      const idx = hostPlayer(cid);
      if (idx < 0) { conn.send({ t: "full", msg: "اللعبة بدأت بدون هذا الجهاز." }); return; }
      const p = ui.st.players[idx];
      p.offline = false; p.bot = false; p.name = name;
    } else {
      let idx = net.seats.findIndex(s => s && s.cid === cid);
      if (idx < 0) idx = net.seats.findIndex(s => !s);
      if (idx < 0) { conn.send({ t: "full", msg: "الغرفة ممتلئة." }); return; }
      net.seats[idx] = { name, cid, online: true };
    }
    const old = net.conns.get(cid);
    if (old && old !== conn) { old.cid = null; old.close(); }
    conn.cid = cid;
    net.conns.set(cid, conn);
    net.sent.delete(conn);
    render();
    runComputer();
    return;
  }
  if (d.t === "say") {
    const seat = hostPlayer(conn.cid), now = Date.now();
    if (!ui.st || seat < 0 || now - (conn.saidAt || 0) < 1000) return;
    conn.saidAt = now;
    hostSay(seat, d.k, d.i);
    return;
  }
  if (d.t === "order") {
    const seat = hostPlayer(conn.cid);
    if (!ui.st || seat < 0 || !Array.isArray(d.ids)) return;
    const hand = ui.st.hands[seat], byId = new Map(hand.map(c => [c.id, c]));
    if (d.ids.length !== hand.length || new Set(d.ids).size !== hand.length || !d.ids.every(id => byId.has(id))) return;
    ui.st.hands[seat] = d.ids.map(id => byId.get(id));
    return;
  }
  if (d.t === "act") {
    const st = ui.st, seat = hostPlayer(conn.cid);
    if (!st || seat < 0) return;
    if (st.current !== seat || ui.thinking || !(st.phase === "draw" || st.phase === "play")) {
      conn.send({ t: "err", msg: "ليس دورك." }); return;
    }
    try { applyAction(st, d.a || {}); }
    catch (e) {
      if (!(e instanceof GameError)) { console.error(e); e = new GameError("حدث خطأ."); }
      conn.send({ t: "err", msg: e.message });
      return;
    }
    const ids = new Set(st.hands[ui.me].map(c => c.id));
    ui.selected = new Set([...ui.selected].filter(id => ids.has(id)));
    render();
    runComputer();
  }
}
function hostOnClose(conn) {
  if (!conn.cid || net.conns.get(conn.cid) !== conn) return;
  net.conns.delete(conn.cid);
  const cid = conn.cid;
  conn.cid = null;
  if (ui.st) { const i = hostPlayer(cid); if (i >= 0) ui.st.players[i].offline = true; }
  else {
    // Im Warteraum wird der Platz wieder frei.
    const i = net.seats.findIndex(s => s && s.cid === cid);
    if (i >= 0) net.seats[i] = null;
  }
  render();
}
function hostBroadcast() {
  if (!net || !net.host) return;
  const lobby = !ui.st;
  for (const conn of net.conns.values()) {
    if (!conn.open) continue;
    let msg;
    if (lobby) msg = { t: "lobby", code: net.code, mode: ui.mode, close: ui.close, speed: ui.speed,
      seats: net.seats.map(s => s && { name: s.cid === "host" ? (ui.name || "المضيف") : s.name, host: s.cid === "host", you: s.cid === conn.cid }) };
    else { const seat = hostPlayer(conn.cid); msg = { t: "state", seat, st: redact(ui.st, seat) }; }
    const json = JSON.stringify(msg);
    if (net.sent.get(conn) === json) continue;
    net.sent.set(conn, json);
    conn.send(Object.assign(msg, { now: Date.now() }));
  }
  hostVoiceList();
  try {
    localStorage.setItem("brk-host", JSON.stringify({ code: net.code, seats: net.seats.map(s => s && { name: s.name, cid: s.cid }),
      mode: ui.mode, close: ui.close, speed: ui.speed, st: ui.st, me: ui.me }));
  } catch (e) {}
}
function hostSetMode(mode) {
  const n = mode === "teams" ? 4 : 2, people = net.seats.filter(Boolean);
  if (people.length > n) { ui.msg = "في الغرفة " + people.length + " لاعبين، لا يمكن اللعب ١ ضد ١."; return; }
  ui.mode = mode;
  net.seats = Array.from({ length: n }, (_, i) => net.seats[i] || null);
  // Wer auf Platz 3/4 saß, rutscht nach vorne.
  people.forEach(p => { if (!net.seats.includes(p)) net.seats[net.seats.indexOf(null)] = p; });
  ui.msg = null;
}
function hostStart() {
  const rules = closeRules();
  let bots = 0;
  const players = net.seats.map(s => s
    ? { name: s.cid === "host" ? (ui.name || "المضيف") : s.name, human: true, cid: s.cid, offline: s.cid !== "host" && !net.conns.has(s.cid) }
    : { name: "كمبيوتر " + (++bots) });
  ui.me = net.seats.findIndex(s => s && s.cid === "host");
  ui.gen++; ui.thinking = false;
  ui.st = newGame(players, rules);
  ui.screen = "table"; ui.selected = new Set(); ui.msg = null;
  render();
  runComputer();
}

// ----- Mitspieler -----
function joinRoom(code) {
  netLeave();
  net = { host: false, status: "connecting", code, lobby: null };
  ui.st = null; ui.screen = "lobby"; ui.selected = new Set(); ui.msg = null; ui.notice = null;
  clientPeer(net);
  render();
}
function clientPeer(me) {
  const peer = new Peer(peerOptions());
  me.peer = peer;
  peer.on("open", () => { if (net === me) clientConnect(me); });
  peer.on("call", call => { if (net === me) voiceIncoming(call); else call.close(); });
  peer.on("disconnected", () => setTimeout(() => { if (net === me && !peer.destroyed) peer.reconnect(); }, 1500));
  peer.on("error", e => {
    if (net !== me) return;
    if (e.type === "peer-unavailable") me.noRoom = true;
    me.status = "lost"; render(); clientRetry(me);
  });
  if (!me.ping) me.ping = setInterval(() => {
    if (net !== me) return clearInterval(me.ping);
    if (me.conn && me.conn.open) {
      if (Date.now() - me.heard > 15000) { me.conn.close(); clientLost(me); }
      else me.conn.send({ t: "ping" });
    }
    voiceSync();
  }, 5000);
}
function clientConnect(me) {
  if (me.conn) { me.conn.removeAllListeners?.(); me.conn.close(); }

// ---------- Sprechen und Schnellnachrichten ----------
// Sprache: jedes Gerät ruft jedes andere direkt an (WebRTC über PeerJS). Der Gastgeber schickt die Liste der Peer-IDs,
// das Gerät mit der kleineren ID ruft an. Ohne Mikrofon wird eine stille Spur gesendet, so ist die Verbindung
// schon da, wenn jemand sein Mikrofon einschaltet (dann wird nur die Spur getauscht, kein neuer Anruf).
const voice = { speaker: localStorage.getItem("brk-speaker") !== "0", mic: false, micStream: null, silent: null, calls: new Map(), ids: [] };
const audioBox = document.createElement("div");
audioBox.hidden = true;
document.body.appendChild(audioBox);

function silentTrack() {
  if (voice.silent && voice.silent.readyState === "live") return voice.silent;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;

}

function voiceAttach(call) {

      audioBox.appendChild(v.audio);

    v.audio.muted = !voice.speaker;
    v.audio.play().catch(() => {});
  });
  const gone = () => { if (voice.calls.get(call.peer) === v) voiceDrop(call.peer); };
  call.on("close", gone);
  call.on("error", gone);

  if (act === "share" || act === "copy") {
    const url = inviteLink(net.code), text = "تعال نلعب بوراكو ديرية! كود الغرفة: " + net.code;
    if (act === "share" && navigator.share) navigator.share({ title: "بوراكو ديرية", text, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(() => { ui.msg = "تم نسخ الرابط."; render(); }, () => { ui.msg = url; render(); });
    return;
  }
  if (act === "lstart") return hostStart();
  if (act === "botseat") {
    const p = ui.st.players[ui.st.current];
    p.bot = true; render(); return runComputer();
  }
  return false;
}

// ----- Zug-Timer -----
// Jeder Mensch hat 30 Sekunden (عادي) bzw. 20 Sekunden (سريع, st.rules.turnSecs) zum Ziehen (Stapel oder Ablage)
// und danach wieder genauso lange bis zum Abwerfen.
// Die Frist (st.deadline) steht im Spielstand: Der Gastgeber (bzw. das Solo-Spiel) setzt sie, prüft sie und
// spielt bei Ablauf automatisch. Sie wird mitgespeichert und übersteht so ein Neuladen.
const turnMs = st => (st.rules && st.rules.turnSecs || 30) * 1000; // alte Spielstände ohne Wert: 30 s
const timerActive = st => (st.phase === "draw" || st.phase === "play") && st.players[st.current].human && !st.players[st.current].bot;
function syncTimer(st) {
  const key = timerActive(st) ? [st.dealer, st.turn, st.current, st.phase].join(":") : null;
  if (st.timerKey === key) return;
  st.timerKey = key;
  st.deadline = key ? Date.now() + turnMs(st) : null;
}
// Wer eine neue Auslage legt oder an eine bestehende anlegt, bekommt Zeit dazu, höchstens bis zur vollen Zugzeit:
// عادي +10 Sekunden (bis 30), سريع +5 Sekunden (bis 20).
const bonusMs = st => turnMs(st) <= 20000 ? 5000 : 10000;
function addTurnTime(st) {
  if (st.deadline && timerActive(st)) st.deadline = Math.min(st.deadline + bonusMs(st), Date.now() + turnMs(st));
}
// Gäste rechnen mit der Uhr des Gastgebers (Abweichung kommt mit jeder Nachricht).
const hostNow = () => Date.now() + (net && !net.host && net.skew || 0);
function timerLeft(st) {
  return st && st.deadline && timerActive(st) ? Math.max(0, Math.ceil((st.deadline - hostNow()) / 1000)) : null;
}
function timerHTML(st) {
  const s = timerLeft(st);
  return s === null ? "" : `<span class="timer ${s <= 10 ? "low" : ""}">⏱ ${s}</span>`;
}
// Zeit abgelaufen: nach Phase 1 vom Stapel ziehen, nach Phase 2 die erste Karte von rechts abwerfen
// (so wie der Spieler seine Hand auf dem Bildschirm sieht; die Hand wird links nach rechts gezeigt).
function timeoutMove(st) {
  if (st.phase === "draw") {
    try { drawStock(st); } catch (e) { takeDiscard(st); }
    st.log += " (انتهى الوقت)";
    return;
  }
  if (st.mustMeld) returnDiscard(st);
  const name = st.players[st.current].name;
  let ok = false;
  for (const c of st.hands[st.current].slice().reverse()) { try { discardCard(st, c.id); ok = true; break; } catch (e) {} }
  if (!ok) nextTurn(st);
  st.log = name + ": انتهى الوقت. " + st.log;
}
setInterval(() => {
  const st = ui.st;
  if (!st || ui.screen !== "table") return;
  if (!(net && !net.host) && !ui.thinking && st.deadline && timerActive(st) && Date.now() >= st.deadline) {
    try { timeoutMove(st); } catch (e) { if (!(e instanceof GameError)) console.error(e); st.deadline = null; }
    if (st.current === ui.me && st.hands[ui.me]) {
      const ids = new Set(st.hands[ui.me].map(c => c.id));
      ui.selected = new Set([...ui.selected].filter(id => ids.has(id)));
    }
    ui.msg = null;
    render();
    runComputer();
    return;
  }
  const s = timerLeft(st);
  app.querySelectorAll(".timer").forEach(el => {
    if (s === null) { el.remove(); return; }
    el.textContent = "⏱ " + s;
    el.classList.toggle("low", s <= 10);
  });
}, 250);

// ----- Nach dem Neuladen weiterspielen -----
function saveSolo() {
  if (net || !ui.st || ui.screen !== "table") return;
  try { localStorage.setItem("brk-solo", JSON.stringify({ st: ui.st, mode: ui.mode, close: ui.close, speed: ui.speed, at: Date.now() })); }
  catch (e) { ui.saveError = String(e && e.name || e); }
}
// Beim Verlassen der Seite noch einmal sicher speichern (iPhone schließt Safari sonst ohne Vorwarnung).
function saveNow() { if (net && net.host) { net.sent.clear(); hostBroadcast(); } else saveSolo(); }
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
// Kleine Anzeige auf der Startseite, ob Speichern im Browser klappt.
function storageInfo() {
  try {
    localStorage.setItem("brk-test", "1");
    if (localStorage.getItem("brk-test") !== "1") return "save ✗";
  } catch (e) { return "save ✗ " + (e && e.name || ""); }
  if (ui.saveError) return "save ✗ " + ui.saveError;
  const keys = ["brk-solo", "brk-host", "brk-guest"].filter(k => localStorage.getItem(k));
  return "save ✓" + (keys.length ? " (" + keys.map(k => k.slice(4)).join(", ") + ")" : "") + (ui.restoreError ? " ✗ " + ui.restoreError : "");
}
function quitCleanup() {
  localStorage.removeItem("brk-solo");
  if (net && !net.host) localStorage.removeItem("brk-guest");
  if (net && net.host) {
    if (!ui.st || ui.st.phase === "gameOver") localStorage.removeItem("brk-host");
    else { const s = savedHost(); if (s) { s.left = true; localStorage.setItem("brk-host", JSON.stringify(s)); } }
  }
}
function restoreOnLoad() {
  const guest = localStorage.getItem("brk-guest"), host = savedHost();
  if (urlParams.get("room")) {
    if (ONLINE && guest === ui.code && ui.name) joinRoom(ui.code);
    return;
  }
  if (ONLINE && host && !host.left) return hostRoom(host);
  let solo = null;
  try { solo = JSON.parse(localStorage.getItem("brk-solo")); } catch (e) {}
  if (solo && solo.st) {
    ui.mode = solo.mode; ui.close = solo.close === 2 ? 2 : 1; ui.speed = speedOf(solo.speed); ui.st = migrateState(solo.st); ui.me = 0;
    ui.screen = "table";
    render();
    runComputer();
  }
}
try { restoreOnLoad(); }
catch (e) { console.error(e); ui.restoreError = String(e && e.message || e).slice(0, 60); ui.screen = "start"; ui.st = null; net = null; }
render();
</script>
